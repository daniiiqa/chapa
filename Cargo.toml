[package]
name = "chapa"
version = "0.1.0"
edition = "2024"
description = "La chapa de discada: bloquea la sesión (ext-session-lock) con el look del rice"
license = "MIT"

[dependencies]
smithay-client-toolkit = "0.21"
wayland-client = { version = "0.31", features = ["system"] }
wayland-egl = "0.32"
khronos-egl = { version = "6", features = ["static"] }
glow = "0.16"
disco = { git = "https://github.com/daniiiqa/disco", features = ["paint"] }
ratatui = "0.29"
tiny-skia = "0.12"
cosmic-text = "0.19"
libc = "0.2"

[profile.release]
lto = true
strip = true
